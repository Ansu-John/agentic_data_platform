name: Deploy Phase 2 - Data Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/environments/dev/02-data-pipeline/**'
      - '.github/workflows/deploy-phase2.yml'
      - 'src/spark/**'
      - 'src/db/**'
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: 'terraform/environments/dev/02-data-pipeline'
  AWS_REGION: 'ap-south-1'
  PROJECT: 'dataplatform'
  ENVIRONMENT: 'dev'
  TF_VAR_image_tag: ${{ github.sha }}

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -diff


      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ===================================================================
      # SPARK & EMR BUILD SEQUENCE
      # ===================================================================
      - name: Provision ECR Repository First (Targeted Apply)
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Creates just the repos so Docker has a place to push!
        run: terraform apply -target="aws_ecr_repository.spark_repo" -target="aws_ecr_repository.dq_agent_repo" -auto-approve -input=false
          
      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-spark-jobs
          IMAGE_TAG: ${{ github.sha }}
        working-directory: src/spark
        run: |
          # 1. Build the image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # 2. VERIFICATION CHECK: Bypass EMR entrypoint and list /home/hadoop contents
          echo "Verifying contents of /home/hadoop in the built image:"
          docker run --rm --entrypoint /bin/bash $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -c "ls -la /home/hadoop"
          
          # 3. VERIFICATION CHECK: Check for the Python script
          docker run --rm --entrypoint /bin/bash $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -c "ls -la /home/hadoop/raw_to_iceberg.py"
          
          # 4. Push the image          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
      - name: Force Stop EMR App for Terraform Update
        env:
          APP_NAME: "${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-spark-engine"
        run: |
          APP_ID=$(aws emr-serverless list-applications --query "applications[?name=='$APP_NAME'].id" --output text)
          if [ "$APP_ID" != "None" ] && [ -n "$APP_ID" ]; then
            STATE=$(aws emr-serverless get-application --application-id $APP_ID --query "application.state" --output text)
            if [ "$STATE" == "STARTED" ] || [ "$STATE" == "STARTING" ]; then
              echo "Application is $STATE. Stopping it to allow Terraform updates..."
              aws emr-serverless stop-application --application-id $APP_ID
              while true; do
                CURRENT_STATE=$(aws emr-serverless get-application --application-id $APP_ID --query "application.state" --output text)
                if [ "$CURRENT_STATE" == "STOPPED" ]; then
                  echo "Application successfully stopped."
                  break
                fi
                echo "Still stopping... current state is $CURRENT_STATE"
                sleep 10
              done
            else
              echo "Application is already stopped or stopping ($STATE)."
            fi
          fi

      # ===================================================================
      # LAMBDA DATABASE INIT SEQUENCE
      # ===================================================================
      - name: Package Database Init Lambda
        run: |
          echo "Packaging Lambda function natively in Linux..."
          rm -rf src/db/package $GITHUB_WORKSPACE/init_db.zip
          mkdir -p src/db/package
          
          cp src/db/init_db.py src/db/package/
          python3 -m pip install pg8000 -t src/db/package/
          chmod -R 755 src/db/package/
          
          cd src/db/package
          zip -r $GITHUB_WORKSPACE/init_db.zip .
          echo "Native zip creation complete."

      # ===================================================================
      # FINAL INFRASTRUCTURE DEPLOYMENT
      # ===================================================================
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Safely injects the Lambda zip path
        run: terraform plan -var="source_code_path=${{ github.workspace }}/init_db.zip" -out=tfplan

      - name: Provision Remaining Infrastructure (Apply)
        if: github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Applies everything (including EMR updates and the Lambda execution)
        run: terraform apply -auto-approve tfplan