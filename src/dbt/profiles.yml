athena_gold:
  target: dev
  outputs:
    dev:
      type: athena
      s3_staging_dir: "s3://{{ env_var('ATHENA_RESULTS_BUCKET') }}/dbt-staging/"
      s3_data_dir: "s3://{{ env_var('GOLD_BUCKET_NAME') }}/"
      s3_data_naming: "schema_table"
      region_name: "{{ env_var('AWS_REGION', 'ap-south-1') }}"
      schema: "{{ env_var('GLUE_DATABASE', 'dataplatform_dev_ai_catalog') }}"
      database: "awsdatacatalog"
      work_group: "{{ env_var('ATHENA_WORKGROUP', 'primary') }}"
      threads: 4